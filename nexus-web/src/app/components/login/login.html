<div class="relative flex flex-col items-center justify-center min-h-screen w-full px-4">
  <div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
    <div class="w-150 h-150 bg-primary-container rounded-full blur-[120px] opacity-20"></div>
  </div>

  <!-- Header Logo -->
  <div class="mb-8 z-10 flex flex-col items-center text-center">
    <div class="flex items-center justify-center w-12 h-12 bg-primary text-on-surface font-headline-lg font-bold rounded mb-4 shadow-[0_0_20px_rgba(255,0,77,0.4)]">K</div>
    <h1 class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tighter glitch-effect" data-text="KyriesRoom">KyriesRoom</h1>
    <p class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase mt-1">Gestión Patrimonial</p>
  </div>

  <!-- Login Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="bg-surface border border-outline-variant p-8 rounded-xl max-w-md w-full shadow-2xl z-10 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-linear-to-r from-transparent via-primary/50 to-transparent"></div>
    <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-primary/30"></div>
    <div class="absolute bottom-0 left-0 w-8 h-8 border-b border-l border-primary/30"></div>

    <h2 class="font-headline-md text-headline-md font-bold mb-8 text-center font-mono-tech tracking-wider text-primary">ENTRADA_SISTEMA</h2>
    <div class="space-y-6">
      <div class="group">
        <label class="block font-label-md text-label-md text-on-surface-variant mb-2 font-mono-tech uppercase tracking-wide group-focus-within:text-primary transition-colors" for="email">IDENTIFICADOR_USUARIO</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-lg">terminal</span>
          <input class="w-full bg-background border border-outline-variant py-3 pl-10 pr-4 text-on-surface font-mono-tech focus:border-primary outline-none focus:ring-0 transition-colors rounded placeholder:text-on-surface-variant/30" formControlName="email" id="email" placeholder="tu@correo.com" type="email"/>
        </div>
      </div>

      <div class="group">
        <label class="block font-label-md text-label-md text-on-surface-variant mb-2 font-mono-tech uppercase tracking-wide group-focus-within:text-primary transition-colors" for="password">CLAVE_ACCESO</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-lg">lock</span>
          <input class="w-full bg-background border border-outline-variant py-3 pl-10 pr-4 text-on-surface font-mono-tech focus:border-primary outline-none focus:ring-0 transition-colors rounded placeholder:text-on-surface-variant/30 tracking-widest" formControlName="password" id="password" placeholder="********" type="password"/>
        </div>
      </div>
    </div>

    <button [disabled]="loginForm.invalid" class="w-full mt-8 py-4 border border-primary text-primary font-mono-tech font-bold hover:bg-primary-container/30 transition-all duration-300 disabled:opacity-50 disabled:border-outline-variant disabled:text-on-surface-variant rounded tracking-widest uppercase relative overflow-hidden group" type="submit">
      <span class="relative z-10 flex items-center justify-center gap-2">
        ACCEDER_TERMINAL
        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
      </span>
      <div class="absolute inset-0 bg-primary/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
    </button>

    <div class="mt-6 text-center">
      <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors font-mono-tech border-b border-transparent hover:border-primary pb-0.5" href="#">RESTABLECER_CONEXION</a>
    </div>
  </form>

  <!-- Footer -->
  <div class="mt-12 z-10 text-center font-mono-tech font-label-sm text-label-sm text-on-surface-variant/50 tracking-widest">
    <p>SYSTEM TERMINAL v1.0.4 <span class="text-primary/70 mx-2">//</span> SECURE CONNECTION <span class="text-primary/70 mx-2">//</span> KYRIESROOM</p>
  </div>
</div>

<p-toast position="top-right" [pt]="{
             root: { class: '!z-[100000]' },
             message: { class: '!bg-transparent !shadow-none !border-none !p-0 !m-0' }
           }">
  <ng-template pTemplate="headless" let-message let-closeFn="closeFn">
    <div class="flex items-start gap-4 p-4 pt-6 pb-6 mb-4 rounded-sm shadow-lg border border-l-5 bg-surface w-full md:w-96 relative overflow-hidden font-mono uppercase tracking-widest"
         [ngClass]="{
              'border-l-secondary border-cyan-400 shadow-cyan-800': message.severity === 'success',
              'border-l-primary border-red-900 shadow-red-900': message.severity === 'error',
              'border-l-yellow-500 border-yellow-700 shadow-yellow-900': message.severity === 'warn'
           }">
        <span class="material-symbols-outlined filled text-2xl m-2"
              [ngClass]="{
                 'text-secondary': message.severity === 'success',
                 'text-primary': message.severity === 'error',
                 'text-yellow-500': message.severity === 'warn'
              }">
          {{ message.severity === 'success' ? 'check_circle' : message.severity === 'error' ? 'error' : 'warning' }}
        </span>
      <div class="flex flex-col gap-1 flex-1">
        <span class="font-bold text-on-surface text-sm tracking-wide">{{ message.summary }}</span>
        <span class="text-xs text-on-surface-variant">{{ message.detail }}</span>
      </div>
      <button (click)="closeFn($event)" class="text-on-surface-variant hover:text-white transition-colors p-1 rounded-full hover:bg-surface-variant flex items-center justify-center w-6 h-6 outline-none ml-auto">
        <span class="material-symbols-outlined text-sm">close</span>
      </button>
    </div>
  </ng-template>
</p-toast>
